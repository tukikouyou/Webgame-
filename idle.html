<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠升维 · 核心玩法 demo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#070709;color:#e8e8e8;font-family:"Microsoft YaHei",Verdana,sans-serif;font-size:14px;}
  #cv{display:block;width:100%;max-width:1600px;margin:0 auto;background:#000;}
  #panel{max-width:1600px;margin:0 auto;padding:8px 14px 24px;}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #2a2a30;padding-bottom:8px;}
  .bar > div{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  button{background:#14141a;color:#e8e8e8;border:1px solid #2f2f38;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;}
  button:hover:not([disabled]){border-color:#666;}
  button[disabled]{opacity:0.38;cursor:default;}
  button.active{background:#e8e8e8;color:#111;font-weight:bold;}
  button.on{background:#1f4f2f;border-color:#3ad07f;}
  button.warn{background:#3a2a10;border-color:#d0902a;}
  button.danger{background:#3a1010;border-color:#d04040;}
  #tabBody{padding-top:10px;min-height:260px;}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .row.big{font-size:16px;}
  .dim{color:#8a8a94;font-size:12.5px;line-height:1.6;}
  h4{margin:14px 0 6px;color:#ccc;font-size:14px;}
  .tbl{border-collapse:collapse;margin:6px 0;}
  .tbl td{padding:5px 14px 5px 0;}
  .pegGrid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px;}
  .peg{border:1px solid #2a2a30;border-radius:8px;padding:8px;line-height:1.9;}
  .peg.empty{border-style:dashed;color:#999;}
  .sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;cursor:pointer;border:2px solid transparent;}
  .sw.sel{border-color:#fff;}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:10px;}
  .card{border:2px solid #444;border-radius:10px;padding:10px;background:#101016;line-height:1.7;}
  .card.locked{opacity:0.4;}
  .card.pickable{cursor:pointer;}
  .card.pickable:hover{background:#1a1a24;}
  .params{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:6px 14px;}
  .params label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:#aaa;}
  .params input{width:80px;background:#14141a;color:#fff;border:1px solid #2f2f38;border-radius:4px;padding:3px 5px;}
  .cE{color:#7fd0ff;} .cS{color:#ffb0f0;} .cL{color:#b0ffb8;} .cMul{color:#5aa9ff;} .cFire{color:#ff6b6b;}
  #pick{position:fixed;inset:0;background:rgba(5,5,8,0.85);display:flex;align-items:center;justify-content:center;z-index:50;}
  #pick.hidden{display:none;}
  #pick .modal{background:#101014;border:1px solid #2a2a30;border-radius:14px;padding:22px 26px;width:min(820px,94vw);}
  #pick h3{margin-bottom:12px;}
</style>
</head>
<body>
<canvas id="cv" width="1600" height="720"></canvas>
<div id="panel">
  <div class="bar">
    <div id="tabs"></div>
    <div><span class="dim">倍速</span><span id="speed"></span></div>
  </div>
  <div id="tabBody"></div>
</div>
<div id="pick" class="hidden"></div>
<script type="module" src="/src/idle/main.ts"></script>
</body>
</html>
