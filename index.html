<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠领土战争</title>
<style>
  :root{ --bg:#070709; --panel:#101014; --line:#2a2a30; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:#e8e8e8;font-family:Verdana,"Microsoft YaHei",sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
         padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header h1{font-size:18px;letter-spacing:2px;font-weight:bold;}
  header h1 span{color:#888;font-size:12px;letter-spacing:1px;margin-left:10px;}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;}
  button{background:var(--panel);color:#e8e8e8;border:1px solid var(--line);
         padding:7px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}
  button:hover{border-color:#555;}
  button.active{background:#e8e8e8;color:#111;font-weight:bold;}
  #wrap{padding:10px;}
  #cv{display:block;width:100%;max-width:1560px;margin:0 auto;background:#000;border-radius:10px;}
  footer{max-width:1560px;margin:4px auto 18px;padding:0 14px;color:#888;font-size:12.5px;line-height:1.8;}
  footer b{color:#ccc;}
  /* ---- 通用遮罩 ---- */
  .overlay{position:fixed;inset:0;background:rgba(5,5,8,0.86);display:flex;
           align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px);}
  .overlay.hidden{display:none;}
  .modal{position:relative;background:#101014;border:1px solid #2a2a30;border-radius:14px;
         padding:22px 26px;max-height:88vh;overflow:auto;box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .modal h2{font-size:20px;letter-spacing:1px;margin-bottom:6px;}
  .modal h3{font-size:14px;color:#bbb;margin:16px 0 8px;letter-spacing:1px;}
  /* ---- 选择界面 ---- */
  #setup .modal{width:min(960px,94vw);}
  .teamGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .teamCard{border:2px solid #2a2a30;border-radius:10px;padding:14px;}
  .teamCard h4{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .dot{width:16px;height:16px;border-radius:50%;display:inline-block;}
  .traitRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .traitBtn{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid #2a2a30;
            background:#16161b;color:#ddd;cursor:pointer;}
  .traitBtn.sel{background:#e8e8e8;color:#111;font-weight:bold;border-color:#e8e8e8;}
  .traitDesc{font-size:11.5px;color:#999;line-height:1.5;min-height:32px;}
  .startBtn{margin-top:18px;width:100%;padding:12px;font-size:16px;font-weight:bold;
            background:#3ad07f;color:#04210f;border:none;border-radius:8px;cursor:pointer;}
  /* ---- 调试面板 ---- */
  #debug{justify-content:flex-end;align-items:stretch;background:rgba(5,5,8,0.35);}
  #debug .modal{width:min(440px,92vw);border-radius:0;}
  .dbgTeam{border:1px solid #23232a;border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .dbgTeam summary{cursor:pointer;font-weight:bold;font-size:14px;display:flex;align-items:center;gap:8px;}
  .dbgField{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;}
  .dbgField label{flex:0 0 120px;color:#aaa;}
  .dbgField input[type=range]{flex:1;min-width:0;}
  .dbgField .val{flex:0 0 56px;text-align:right;color:#fff;font-variant-numeric:tabular-nums;}
  .dbgField select{flex:1;background:#16161b;color:#ddd;border:1px solid #2a2a30;border-radius:5px;padding:4px;}
  .dbgGlobal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .dbgGlobal button{font-size:12px;padding:5px 10px;}
  .closeX{position:absolute;top:12px;right:16px;cursor:pointer;font-size:22px;color:#888;line-height:1;}
</style>
</head>
<body>
<header>
  <h1>弹珠领土战争<span>RELEASE · MULTIPLY · SPIN</span></h1>
  <div class="ctrl">
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnReset">↻ 重新开始</button>
    <button id="btnSetup">⚙ 选择炮台</button>
    <button id="btnDebug">🛠 调试面板</button>
    <button class="sp active" data-s="1">1×</button>
    <button class="sp" data-s="2">2×</button>
    <button class="sp" data-s="4">4×</button>
  </div>
</header>
<!-- 开局选择界面 -->
<div id="setup" class="overlay">
  <div class="modal">
    <h2>选择炮台专属特性</h2>
    <p style="color:#999;font-size:13px;margin-bottom:6px;">为四个炮台各选一项专属特性,然后开始对战。</p>
    <div class="teamGrid" id="setupGrid"></div>
    <button class="startBtn" id="btnStart">开始对战 ▶</button>
  </div>
</div>
<!-- 调试面板 -->
<div id="debug" class="overlay hidden">
  <div class="modal">
    <span class="closeX" id="dbgClose">×</span>
    <h2>🛠 调试面板</h2>
    <div class="dbgGlobal">
      <button id="dbgHealAll">全员回满血</button>
      <button id="dbgAmmo1k">全员弹药+1000</button>
      <button id="dbgClearMarbles">清空场上弹珠</button>
    </div>
    <div id="dbgBody"></div>
  </div>
</div>
<div id="wrap"><canvas id="cv" width="1600" height="900"></canvas></div>
<footer>
  <b>规则:</b>左上弹珠面板不断掉落四色小球;RELEASE 与 MULTIPLY 开局等宽,随时间 RELEASE 渐窄、MULTIPLY 渐宽,
  3 分钟后稳定为 1:4,SPIN 宽度不变 —— 落入 <b>MULTIPLY</b>:该色弹药 ×2(初始为 1);
  落入 <b>RELEASE</b>:炮台把累计弹药全部发射出去;落入 <b>SPIN</b>:小球进入右上技能转盘,在圆形节点间弹跳,
  只能从内圈挡板底部的小口掉进不断旋转的技能圆环——落在哪个扇区就触发哪个技能。
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
